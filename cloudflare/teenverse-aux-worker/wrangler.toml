name = "teenverse-aux-worker"
main = "src/index.ts"
compatibility_date = "2026-06-30"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[secrets]
required = ["INTERNAL_WORKER_SECRET", "META_GRAPH_ACCESS_TOKEN", "SUPABASE_ANON_KEY"]

[[d1_databases]]
binding = "AUX_DB"
database_name = "teenverse_aux"
database_id = "33d32454-adcc-4947-b20f-cda92108112c"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "436054bdf4e046e8b201179c33f0951a"

[[r2_buckets]]
binding = "TEENVERSE_FILES"
bucket_name = "teenverse-files"

[vars]
SUPABASE_URL = "https://bjxmxihjcbgieaohqipw.supabase.co"
SUPABASE_JWT_ISSUER = "https://bjxmxihjcbgieaohqipw.supabase.co/auth/v1"
ALLOWED_ORIGINS = "https://app.teenversehub.in,https://intern.teenversehub.in,https://business.teenversehub.in,http://localhost:5173,http://localhost:5174"
VERCEL_PRODUCTION_URL = "https://app.teenversehub.in"
